name: 每日同步赛博中国鸡蛋

on:
  schedule:
    # 北京时间 09:00 自动跑（UTC 01:00）
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 抓取上游 + 品牌转换 + 校验 + 部署
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/sync.mjs --deploy

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-log
          path: logs/*.log
          retention-days: 7
